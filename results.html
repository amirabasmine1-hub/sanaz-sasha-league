<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نتایج | لیگ تخته ساناز و ساشا</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(circle at top right, #24105c 0%, transparent 35%),
                radial-gradient(circle at bottom left, #071d45 0%, transparent 35%),
                #050712;
            color: #fff;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(5, 7, 18, 0.88);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
        }

        .nav {
            max-width: 1200px;
            margin: auto;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #c084fc;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-links a {
            padding: 9px 13px;
            border-radius: 10px;
            color: #b8bdd4;
            font-size: 13px;
            transition: .2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(139, 92, 246, .15);
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 45px 20px 70px;
        }

        .hero {
            text-align: center;
            margin-bottom: 35px;
        }

        .badge {
            display: inline-block;
            padding: 7px 14px;
            border: 1px solid rgba(168, 85, 247, .35);
            border-radius: 999px;
            color: #c084fc;
            background: rgba(168, 85, 247, .08);
            font-size: 12px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(30px, 6vw, 50px);
            margin-bottom: 12px;
        }

        .hero p {
            color: #9299b5;
            font-size: 15px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat {
            background: rgba(14, 18, 38, .8);
            border: 1px solid rgba(139, 92, 246, .17);
            border-radius: 18px;
            padding: 22px;
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #c084fc;
            margin-bottom: 6px;
        }

        .stat-label {
            color: #858ca8;
            font-size: 13px;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin: 30px 0 15px;
        }

        .section-title h2 {
            font-size: 20px;
        }

        .refresh {
            border: 1px solid rgba(139, 92, 246, .25);
            background: rgba(139, 92, 246, .1);
            color: #d8b4fe;
            padding: 9px 14px;
            border-radius: 10px;
            cursor: pointer;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .result-card {
            background: linear-gradient(
                145deg,
                rgba(17, 22, 45, .95),
                rgba(9, 12, 27, .95)
            );
            border: 1px solid rgba(139, 92, 246, .2);
            border-radius: 20px;
            padding: 22px;
            position: relative;
            overflow: hidden;
        }

        .result-card::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(
                90deg,
                transparent,
                #8b5cf6,
                #38bdf8,
                transparent
            );
        }

        .result-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .result-number {
            color: #717892;
            font-size: 12px;
        }

        .completed {
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 11px;
            color: #86efac;
            background: rgba(34, 197, 94, .1);
            border: 1px solid rgba(34, 197, 94, .2);
        }

        .scoreboard {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 15px;
        }

        .player {
            text-align: center;
        }

        .player-name {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .score {
            font-size: 38px;
            font-weight: bold;
            color: #c084fc;
        }

        .winner {
            color: #86efac;
        }

        .dash {
            color: #646b84;
            font-size: 20px;
        }

        .result-info {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,.06);
            display: flex;
            justify-content: space-between;
            gap: 10px;
            color: #8d94ae;
            font-size: 12px;
        }

        .winner-box {
            margin-top: 16px;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            background: rgba(34,197,94,.07);
            color: #86efac;
            font-size: 12px;
        }

        .empty,
        .error,
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 55px 20px;
            border: 1px dashed rgba(139, 92, 246, .25);
            border-radius: 20px;
            color: #858ca8;
            background: rgba(10,13,29,.6);
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .error {
            color: #fca5a5;
            border-color: rgba(239,68,68,.25);
        }

        footer {
            border-top: 1px solid rgba(139,92,246,.15);
            text-align: center;
            padding: 25px 15px;
            color: #626a84;
            font-size: 12px;
        }

        @media (max-width: 750px) {
            .nav {
                flex-direction: column;
                align-items: stretch;
            }

            .nav-links {
                justify-content: center;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .results {
                grid-template-columns: 1fr;
            }

            .result-info {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

<header>
    <nav class="nav">
        <div class="logo">🎲 لیگ تخته</div>

        <div class="nav-links">
            <a href="index.html">خانه</a>
            <a href="news.html">اخبار</a>
            <a href="matches.html">بازی‌ها</a>
            <a href="results.html" class="active">نتایج</a>
            <a href="table.html">جدول</a>
            <a href="players.html">بازیکنان</a>
            <a href="rules.html">قوانین</a>
        </div>
    </nav>
</header>

<main class="container">

    <section class="hero">
        <span class="badge">🏆 نتایج رسمی لیگ</span>

        <h1>نتایج مسابقات</h1>

        <p>
            نتایج ثبت‌شده مسابقات لیگ تخته ساناز و ساشا
        </p>
    </section>

    <section class="stats">

        <div class="stat">
            <div class="stat-number" id="totalResults">۰</div>
            <div class="stat-label">نتایج ثبت‌شده</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="totalCompleted">۰</div>
            <div class="stat-label">مسابقات برگزارشده</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="mostWins">—</div>
            <div class="stat-label">بیشترین برد</div>
        </div>

    </section>

    <div class="section-title">

        <h2>📊 نتایج ثبت‌شده</h2>

        <button class="refresh" onclick="loadResults()">
            ↻ بروزرسانی
        </button>

    </div>

    <section class="results" id="resultsList">

        <div class="loading">
            در حال دریافت نتایج...
        </div>

    </section>

</main>

<footer>
    لیگ تخته ساناز و ساشا — ساخته شده توسط امیر عباس ❤️
</footer>

<script>

    const faNumber = number => {
        if (number === null || number === undefined) return "—";

        return Number(number).toLocaleString("fa-IR");
    };


    function escapeHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function formatDate(date) {

        if (!date) return "تاریخ نامعلوم";

        try {

            return new Date(date + "T00:00:00")
                .toLocaleDateString("fa-IR", {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                });

        } catch {

            return date;

        }

    }


    async function loadResults() {

        const list = document.getElementById("resultsList");

        list.innerHTML = `
            <div class="loading">
                در حال دریافت نتایج...
            </div>
        `;


        try {

            // دریافت نتایج
            const {
                data: results,
                error: resultsError
            } = await supabaseClient
                .from("results")
                .select("*")
                .order("created_at", {
                    ascending: false
                });


            if (resultsError) {
                throw resultsError;
            }


            // دریافت مسابقات
            const {
                data: matches,
                error: matchesError
            } = await supabaseClient
                .from("matches")
                .select("*");


            if (matchesError) {
                throw matchesError;
            }


            // دریافت بازیکنان
            const {
                data: players,
                error: playersError
            } = await supabaseClient
                .from("players")
                .select("id, name");


            if (playersError) {
                throw playersError;
            }


            const allResults = results || [];
            const allMatches = matches || [];
            const allPlayers = players || [];


            // ساخت نقشه بازیکنان
            const playerMap = {};

            allPlayers.forEach(player => {
                playerMap[player.id] = player.name;
            });


            // ساخت نقشه مسابقات
            const matchMap = {};

            allMatches.forEach(match => {
                matchMap[match.id] = match;
            });


            // آمار
            document.getElementById("totalResults").textContent =
                faNumber(allResults.length);


            const completedMatches =
                allMatches.filter(match => match.status === "completed");


            document.getElementById("totalCompleted").textContent =
                faNumber(completedMatches.length);


            // محاسبه بیشترین برد
            const winCounts = {};

            allResults.forEach(result => {

                if (result.winner_id) {

                    winCounts[result.winner_id] =
                        (winCounts[result.winner_id] || 0) + 1;

                }

            });


            let topPlayerId = null;
            let topWins = 0;

            Object.keys(winCounts).forEach(playerId => {

                if (winCounts[playerId] > topWins) {

                    topWins = winCounts[playerId];
                    topPlayerId = playerId;

                }

            });


            if (topPlayerId) {

                document.getElementById("mostWins").textContent =
                    playerMap[topPlayerId] || "—";

            } else {

                document.getElementById("mostWins").textContent = "—";

            }


            // اگر نتیجه‌ای وجود ندارد
            if (allResults.length === 0) {

                list.innerHTML = `
                    <div class="empty">

                        <div class="empty-icon">
                            🏆
                        </div>

                        <h3>
                            هنوز نتیجه‌ای ثبت نشده
                        </h3>

                        <p style="margin-top:10px;">
                            نتیجه مسابقات از پنل مدیریت اینجا نمایش داده می‌شود.
                        </p>

                    </div>
                `;

                return;

            }


            // ساخت کارت نتایج
            list.innerHTML = allResults.map((result, index) => {

                const match = matchMap[result.match_id];

                const player1 =
                    match
                        ? (playerMap[match.player1_id] || "بازیکن اول")
                        : "بازیکن اول";


                const player2 =
                    match
                        ? (playerMap[match.player2_id] || "بازیکن دوم")
                        : "بازیکن دوم";


                const score1 =
                    result.score1 ?? 0;

                const score2 =
                    result.score2 ?? 0;


                const winnerName =
                    result.winner_id
                        ? (playerMap[result.winner_id] || "نامشخص")
                        : "نامشخص";


                const player1Winner =
                    result.winner_id &&
                    match &&
                    Number(result.winner_id) === Number(match.player1_id);


                const player2Winner =
                    result.winner_id &&
                    match &&
                    Number(result.winner_id) === Number(match.player2_id);


                const date =
                    match
                        ? formatDate(match.match_date)
                        : "تاریخ نامعلوم";


                return `

                    <article class="result-card">

                        <div class="result-top">

                            <span class="result-number">
                                نتیجه #${faNumber(index + 1)}
                            </span>

                            <span class="completed">
                                ✓ برگزار شده
                            </span>

                        </div>


                        <div class="scoreboard">

                            <div class="player">

                                <div class="
                                    player-name
                                    ${player1Winner ? "winner" : ""}
                                ">
                                    ${escapeHTML(player1)}
                                </div>

                                <div class="
                                    score
                                    ${player1Winner ? "winner" : ""}
                                ">
                                    ${faNumber(score1)}
                                </div>

                            </div>


                            <div class="dash">
                                -
                            </div>


                            <div class="player">

                                <div class="
                                    player-name
                                    ${player2Winner ? "winner" : ""}
                                ">
                                    ${escapeHTML(player2)}
                                </div>

                                <div class="
                                    score
                                    ${player2Winner ? "winner" : ""}
                                ">
                                    ${faNumber(score2)}
                                </div>

                            </div>

                        </div>


                        <div class="winner-box">

                            🏆 برنده:
                            <strong>
                                ${escapeHTML(winnerName)}
                            </strong>

                        </div>


                        <div class="result-info">

                            <span>
                                📅 ${escapeHTML(date)}
                            </span>

                            <span>
                                🎲 مسابقه #${faNumber(result.match_id)}
                            </span>

                        </div>

                    </article>

                `;

            }).join("");


        } catch (error) {

            console.error(
                "خطا در دریافت نتایج:",
                error
            );


            list.innerHTML = `

                <div class="error">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h3>
                        دریافت نتایج با خطا مواجه شد
                    </h3>

                    <p style="margin-top:10px;">
                        اتصال به Supabase یا دسترسی جدول نتایج را بررسی کنید.
                    </p>

                    <p style="
                        margin-top:12px;
                        direction:ltr;
                        font-size:11px;
                        opacity:.7;
                    ">
                        ${escapeHTML(
                            error.message || "Unknown error"
                        )}
                    </p>

                </div>

            `;

        }

    }


    loadResults();

</script>

</body>
</html>
