<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>جدول لیگ | لیگ تخته ساناز و ساشا</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Vazirmatn", sans-serif;
            background:
                radial-gradient(circle at 15% 10%, rgba(124, 58, 237, 0.16), transparent 30%),
                radial-gradient(circle at 85% 20%, rgba(59, 130, 246, 0.13), transparent 30%),
                #060611;
            color: #fff;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* HEADER */

        header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            z-index: 1000;

            background: rgba(6, 6, 17, 0.78);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.15);
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            padding: 16px 22px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 20px;
            font-weight: 900;
        }

        .logo-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #2563eb
            );

            box-shadow:
                0 0 25px rgba(124, 58, 237, 0.35);
        }

        .logo span {
            color: #a78bfa;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav a {
            padding: 8px 11px;
            border-radius: 9px;

            color: #aaaac2;
            font-size: 13px;

            transition: 0.25s;
        }

        nav a:hover {
            color: white;
            background: rgba(124, 58, 237, 0.13);
        }

        nav a.active {
            color: white;
            background: rgba(124, 58, 237, 0.2);
        }

        /* MAIN */

        main {
            max-width: 1150px;
            margin: auto;
            padding: 135px 22px 60px;
        }

        .hero {
            text-align: center;
            margin-bottom: 42px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 8px 14px;
            border-radius: 999px;

            background: rgba(124, 58, 237, 0.12);
            border: 1px solid rgba(167, 139, 250, 0.2);

            color: #c4b5fd;
            font-size: 13px;
            font-weight: 700;

            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: clamp(34px, 6vw, 58px);
            font-weight: 900;
            line-height: 1.2;

            background: linear-gradient(
                90deg,
                #fff,
                #c4b5fd,
                #60a5fa
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: #9898b2;
            margin-top: 14px;
            font-size: 15px;
        }

        /* INFO CARDS */

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }
