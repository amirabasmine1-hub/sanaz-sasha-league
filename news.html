<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اخبار | لیگ تخته ساناز و ساشا</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #060611;
            --panel: #0e0e1d;
            --border: rgba(255,255,255,.07);
            --purple: #7c4dff;
            --purple-light: #a78bfa;
            --blue: #00b7ff;
            --text: #fff;
            --muted: #858497;
            --green: #39d98a;
        }

        body {
            font-family: "Vazirmatn", sans-serif;
            background:
                radial-gradient(circle at 10% 5%, rgba(124,77,255,.13), transparent 28%),
                radial-gradient(circle at 90% 15%, rgba(0,183,255,.08), transparent 28%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            height: 72px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: rgba(6,6,17,.82);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 900;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--purple), var(--blue));
            box-shadow: 0 0 25px rgba(124,77,255,.3);
        }

        .logo span {
            color: var(--purple-light);
        }

        nav {
            display: flex;
            gap: 7px;
        }

        nav a {
            color: #858497;
            font-size: 11px;
            padding: 9px 11px;
            border-radius: 9px;
            transition: .2s;
        }

        nav a:hover,
        nav a.active {
            color: white;
            background: rgba(124,77,255,.12);
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 125px 25px 60px;
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .badge {
            display: inline-block;
            padding: 7px 13px;
            border-radius: 999px;
            color: #c4b5fd;
            background: rgba(124,77,255,.10);
            border: 1px solid rgba(167,139,250,.18);
            font-size: 10px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--muted);
            font-size: 13px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .news-card {
            background: rgba(15,15,30,.76);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            transition: .25s;
        }

        .news-card:hover {
            transform: translateY(-3px);
            border-color: rgba(124,77,255,.3);
        }

        .news-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .news-image-placeholder {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            background:
                radial-gradient(circle at 30% 30%, rgba(124,77,255,.25), transparent 40%),
                linear-gradient(135deg, #111126, #0b1224);
        }

        .news-content {
            padding: 20px;
        }

        .news-date {
            color: var(--purple-light);
            font-size: 10px;
            margin-bottom: 9px;
        }

        .news-title {
            font-size: 17px;
            margin-bottom: 10px;
        }

        .news-text {
            color: #858497;
            font-size: 12px;
            line-height: 2;
            white-space: pre-wrap;
        }

        .empty {
            text-align: center;
            padding: 70px 20px;
            border: 1px dashed rgba(255,255,255,.08);
            border-radius: 20px;
            color: #666579;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: var(--muted);
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 25px;
            text-align: center;
            color: #555468;
            font-size: 11px;
        }

        @media (max-width: 800px) {
            header {
                padding: 0 15px;
            }

            nav {
                display: none;
            }

            .news-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

<header>

    <a href="index.html" class="logo">
        <div class="logo-icon">🏆</div>
        <div>
            لیگ <span>تخته</span>
        </div>
    </a>

    <nav>
        <a href="index.html">خانه</a>
        <a href="news.html" class="active">اخبار</a>
        <a href="matches.html">بازی‌ها</a>
        <a href="results.html">نتایج</a>
        <a href="table.html">جدول</a>
        <a href="players.html">بازیکنان</a>
        <a href="rules.html">قوانین</a>
    </nav>

</header>

<main>

    <section class="hero">

        <div class="badge">
            📰 اطلاعیه‌های رسمی
        </div>

        <h1>
            اخبار لیگ
        </h1>

        <p>
            آخرین اخبار و اطلاعیه‌های رسمی لیگ تخته ساناز و ساشا
        </p>

    </section>


    <section id="newsContainer">

        <div class="loading">
            ⏳ در حال دریافت اخبار...
        </div>

    </section>

</main>

<footer>
    🏆 لیگ تخته ساناز و ساشا · سایت رسمی لیگ تخته · ساخته شده توسط امیر عباس ❤️
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

    function escapeHTML(text) {
        return String(text ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    async function loadNews() {

        const container =
            document.getElementById("newsContainer");

        const { data, error } = await supabaseClient
            .from("news")
            .select("id, title, content, image_url, created_at")
            .order("created_at", {
                ascending: false
            });

        if (error) {

            console.error("News Error:", error);

            container.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">⚠️</div>
                    <div>
                        دریافت اخبار با خطا مواجه شد.
                    </div>
                </div>
            `;

            return;
        }

        if (!data || data.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">📰</div>
                    <div>
                        هنوز خبری منتشر نشده است.
                    </div>
                </div>
            `;

            return;
        }

        container.innerHTML = `
            <div class="news-grid">

                ${data.map(news => {

                    const date = news.created_at
                        ? new Date(news.created_at).toLocaleString(
                            "fa-IR",
                            {
                                dateStyle: "medium",
                                timeStyle: "short"
                            }
                        )
                        : "تاریخ نامعلوم";

                    const image = news.image_url
                        ? `
                            <img
                                class="news-image"
                                src="${escapeHTML(news.image_url)}"
                                alt="${escapeHTML(news.title)}"
                                loading="lazy"
                            >
                        `
                        : `
                            <div class="news-image-placeholder">
                                📰
                            </div>
                        `;

                    return `
                        <article class="news-card">

                            ${image}

                            <div class="news-content">

                                <div class="news-date">
                                    🕐 ${escapeHTML(date)}
                                </div>

                                <h2 class="news-title">
                                    ${escapeHTML(news.title)}
                                </h2>

                                <div class="news-text">
                                    ${escapeHTML(news.content)}
                                </div>

                            </div>

                        </article>
                    `;

                }).join("")}

            </div>
        `;
    }

    loadNews();

</script>

</body>
</html>
